<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
{% if page.description %}
<meta name="description" content="{{ page.description }}">
{% endif %}
<style>
:root {
  color-scheme: light dark;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  line-height: 1.5;
  max-width: 46rem;
  margin: 2rem auto;
  padding: 0 1rem;
}

h1, h2, h3 {
  line-height: 1.25;
}

pre, code {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.95em;
}

pre {
  overflow-x: auto;
  padding: 0.75rem;
  border: 1px solid #7777;
  border-radius: 4px;
}

table {
  border-collapse: collapse;
  width: 100%;
  display: block;
  overflow-x: auto;
}

th, td {
  border: 1px solid #777;
  padding: 0.35rem 0.5rem;
  text-align: left;
}

img {
  max-width: 100%;
}

blockquote {
  border-left: 3px solid #777;
  margin-left: 0;
  padding-left: 1rem;
}

hr {
  border: none;
  border-top: 1px solid #7777;
  margin: 2rem 0;
}

.nav {
  margin-bottom: 1.5rem;
  font-size: 0.95rem;
}

.nav a {
  margin-right: 0.75rem;
}

.meta {
  opacity: 0.75;
  font-size: 0.9rem;
}
</style>
</head>
<body>
<div class="nav">
  <a href="{{ '/' | relative_url }}">Index</a>
  <a href="{{ '/about/' | relative_url }}">About</a>
  <a href="https://github.com/avolk201/procedural-gfx-fpga">Repository</a>
</div>

{% if page.title %}
<h1>{{ page.title }}</h1>
{% endif %}

{% if page.date %}
<p class="meta">{{ page.date | date: "%Y-%m-%d" }}</p>
{% endif %}

{{ content }}
</body>
</html>
